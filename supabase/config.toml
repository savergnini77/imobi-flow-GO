# Configuração do Supabase CLI para o ambiente LOCAL (supabase start).
# Valores omitidos usam o padrão do CLI. Não contém segredos.

project_id = "imobi-flow-go"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

# E-mails locais (confirmação de cadastro, recuperação de senha) caem no
# Mailpit: http://localhost:54324
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
# "**" aceita os parâmetros que o app acrescenta (?next=/convite/...).
additional_redirect_urls = ["http://localhost:3000/auth/callback**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true
minimum_password_length = 8

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
